<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日塔羅運勢</title>
  <!-- 引入 LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card-container {
      width: 220px;
      height: 380px;
      perspective: 1000px;
      margin-bottom: 20px;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
      transition: transform 0.5s ease;
    }
    .reversed {
      transform: rotate(180deg);
    }
    .card-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #f1c40f;
      margin-top: 10px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      background: #34495e;
      margin-left: 8px;
    }
    .card-meaning {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      max-width: 320px;
      margin-top: 15px;
      line-height: 1.6;
      font-size: 0.95rem;
      color: #dddddd;
      text-align: justify;
    }
    #loading { font-size: 1.1rem; color: #888; }
  </style>
</head>
<body>

  <div id="loading">✨ 正在讀取靈感與卡牌...</div>

  <div id="result" style="display: none; text-align: center;">
    <p id="status-msg" style="color: #aaa; font-size: 0.9rem;"></p>
    
    <div class="card-container">
      <img id="card-image" class="card-img" src="" alt="塔羅牌">
    </div>

    <div class="card-title">
      <span id="card-name"></span>
      <span id="card-position" class="badge"></span>
    </div>

    <div id="card-meaning" class="card-meaning"></div>
  </div>

  <script>
    const LIFF_ID = "2010788391-bIBpQ7sB"; // 填入你的 LIFF ID
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxAW452Y-dFwIo3BGAkus4ozZ4s3aeTa0L19ZBW_hFvdfjCHATkYayBUPbpfOlMvz0F/exec"; // 填入部署好的 GAS 網址

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId;

        // 向 GAS 發送抽卡請求
        const res = await fetch(`${GAS_API_URL}?userId=${userId}`);
        const result = await res.json();

        if (result.status === "error") {
          document.getElementById("loading").innerText = "發生錯誤：" + result.message;
          return;
        }

        // 渲染畫面
        document.getElementById("loading").style.display = "none";
        document.getElementById("result").style.display = "block";

        document.getElementById("status-msg").innerText = result.message;
        document.getElementById("card-name").innerText = result.data.name;
        document.getElementById("card-position").innerText = result.data.position;
        document.getElementById("card-meaning").innerText = result.data.meaning;

        const imgEl = document.getElementById("card-image");
        imgEl.src = result.data.imageUrl;

        // 若為逆位，加上旋轉 180 度樣式
        if (result.data.position === "逆位") {
          imgEl.classList.add("reversed");
        }

      } catch (err) {
        document.getElementById("loading").innerText = "載入失敗，請稍後再試！";
        console.error(err);
      }
    }

    main();
  </script>
</body>
</html>
